spring:
  application:
    name: keystone-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/keystone}
    username: ${DB_USERNAME:keystone}
    password: ${DB_PASSWORD:keystone}
    maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    # MUST be overridden via environment in any real deployment.
    secret: ${JWT_SECRET:keystone-dev-secret-key-change-me-in-production-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  sla:
    # Work orders become AT_RISK when within this fraction of the window remaining.
    risk-threshold-fraction: ${SLA_RISK_THRESHOLD_FRACTION:0.25}
  scheduler:
    enabled: ${SLA_SCHEDULER_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    "com.meridian.keystone": INFO